<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Microfinance loan calculator built with React — monthly payments, total interest and a full amortization schedule in FCFA. Bilingual English/French with dark mode."
    />
    <title>MFI Loan Calculator — React</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of light mode.
      ;(function () {
        try {
          var params = new URLSearchParams(window.location.search)
          var urlTheme = params.get('theme')
          var stored = localStorage.getItem('theme')
          var dark =
            urlTheme === 'dark' ||
            (!urlTheme &&
              (stored === 'dark' ||
                (!stored &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches)))
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
